name: lumo
description: Lumo — The future of shopping.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # Backend
  supabase_flutter: ^2.8.4

  # Local Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # UI & Animations
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3

  # Fonts
  google_fonts: ^6.2.1

  # Utils
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.5.0
  path_provider: ^2.1.5

  # Image
  flutter_svg: ^2.0.17

  # Haptics
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/illustrations/

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Thin.ttf
          weight: 100
        - asset: assets/fonts/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
